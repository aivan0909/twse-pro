<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060809">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="台股PRO">
<meta name="description" content="台灣股市投資組合追蹤，支援K線、籌碼、警報、技術指標">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>台股∞PRO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#060809;--bg1:#0e1116;--bg2:#141820;--bg3:#1a1f28;--bg4:#222830;--bg5:#2a3040;
  --border:#252c38;--border2:#32404f;--border3:#3d5060;
  --t0:#dde4ee;--t1:#8fa0b4;--t2:#556070;--t3:#303c48;
  --up:#00c896;--up2:#009e76;--up3:rgba(0,200,150,.12);
  --dn:#ff4d6a;--dn2:#cc3050;--dn3:rgba(255,77,106,.12);
  --acc:#3d9eff;--acc2:#1a7ddc;--acc3:rgba(61,158,255,.12);
  --gold:#f5a623;--purple:#9b6dff;
  --mono:'Space Mono',monospace;--sans:'Noto Sans TC',sans-serif;
  --r:6px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg0);color:var(--t0);font-family:var(--sans);font-size:13px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── layout ── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;flex-wrap:wrap}
.logo{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.logo span{color:var(--up)}
.topbar-right{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tbtn{background:var(--bg3);border:1px solid var(--border2);color:var(--t1);font-family:var(--mono);font-size:10px;padding:5px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;transition:all .15s;-webkit-tap-highlight-color:transparent}
.tbtn:hover,.tbtn:active{background:var(--bg5);color:var(--t0)}
.tbtn.g{background:var(--up2);border-color:var(--up);color:#fff}
.tbtn.r{border-color:var(--dn2);color:var(--dn)}
.tbtn.acc{background:var(--acc2);border-color:var(--acc);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:20px;border:1px solid}
.badge.offline{color:var(--t2);border-color:var(--border2)}
.badge.live{color:var(--up);border-color:var(--up)}
.badge.eod{color:var(--acc);border-color:var(--acc)}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.live .dot{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── summary strip ── */
.sumstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
@media(max-width:480px){.sumstrip{grid-template-columns:repeat(3,1fr)}}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:8px 10px;position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sc.u::before{background:var(--up)}.sc.d::before{background:var(--dn)}.sc.a::before{background:var(--acc)}.sc.g::before{background:var(--gold)}
.sc-lbl{font-size:9px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);margin-bottom:3px}
.sc-val{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--t0);line-height:1}
.sc-sub{font-family:var(--mono);font-size:9px;margin-top:3px}
.cu{color:var(--up)}.cd{color:var(--dn)}.cn{color:var(--t2)}.cg{color:var(--gold)}.ca{color:var(--acc)}

/* ── main area ── */
.main-area{flex:1;display:grid;overflow:hidden}
.desktop-layout{grid-template-columns:230px 1fr 220px}
.mobile-layout{grid-template-columns:1fr}
@media(min-width:820px){.main-area{grid-template-columns:230px 1fr 220px}}
@media(max-width:819px){.main-area{grid-template-columns:1fr;grid-template-rows:1fr auto}}

/* ── panel ── */
.panel{background:var(--bg2);border-right:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.panel:last-child{border-right:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;gap:6px}
.ptitle{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--t2);font-family:var(--mono);white-space:nowrap}
.pact{display:flex;gap:3px;flex-wrap:wrap}
.pbtn{background:none;border:1px solid var(--border2);color:var(--t2);font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:3px;cursor:pointer;transition:all .15s;white-space:nowrap}
.pbtn:hover,.pbtn:active{background:var(--bg4);color:var(--t0)}
.pbtn.sel{background:var(--acc2);border-color:var(--acc);color:#fff}
.pbtn.g{background:var(--up2);border-color:var(--up);color:#fff}
.pbtn.r{border-color:var(--dn);color:var(--dn)}
.pcontent{flex:1;overflow-y:auto;overflow-x:hidden}

/* ── stock list ── */
.sitem{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;gap:6px;transition:background .1s}
.sitem:hover,.sitem:active{background:var(--bg3)}
.sitem.sel{background:var(--bg4);border-left:2px solid var(--acc)}
.si-l{flex:1;min-width:0}
.si-name{font-weight:500;color:var(--t0);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-id{font-family:var(--mono);font-size:9px;color:var(--t2);margin-top:1px}
.si-r{text-align:right;flex-shrink:0}
.si-price{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--t0)}
.si-chg{font-family:var(--mono);font-size:9px;margin-top:1px}
.pill{font-size:8px;padding:1px 4px;border-radius:2px;font-family:var(--mono);vertical-align:middle;margin-left:3px}
.pill.rt{background:var(--up3);color:var(--up)}.pill.eod{background:var(--acc3);color:var(--acc)}
.delbtn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:12px;padding:2px;transition:color .15s;flex-shrink:0}
.delbtn:hover{color:var(--dn)}
@keyframes fg{0%{background:var(--up3)}100%{background:transparent}}
@keyframes fr{0%{background:var(--dn3)}100%{background:transparent}}
.fg{animation:fg .8s ease-out}.fr{animation:fr .8s ease-out}

/* ── center tabs ── */
.ctabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.ctab{flex:1;padding:7px 4px;text-align:center;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);cursor:pointer;transition:all .15s;border-bottom:2px solid transparent}
.ctab:hover{color:var(--t0);background:var(--bg3)}
.ctab.active{color:var(--acc);border-bottom-color:var(--acc)}

/* ── K-line ── */
.kinfo{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px;flex-shrink:0}
.kibox{background:var(--bg3);border-radius:4px;padding:5px 7px}
.kilbl{font-family:var(--mono);font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.kival{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--t0)}
.chart-area{flex:1;padding:4px 6px;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%}
.indicator-toggles{display:flex;gap:4px;padding:4px 8px;flex-shrink:0;flex-wrap:wrap;border-top:1px solid var(--border)}
.itgl{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid;cursor:pointer;transition:all .15s}
.itgl.off{border-color:var(--border2);color:var(--t3);background:none}
.itgl.on{background:var(--bg4);color:var(--t0)}
.itgl.ma5{border-color:var(--gold)}.itgl.ma5.on{color:var(--gold)}
.itgl.ma10{border-color:var(--purple)}.itgl.ma10.on{color:var(--purple)}
.itgl.bb{border-color:#38bdf8}.itgl.bb.on{color:#38bdf8}
.itgl.kd{border-color:#fb923c}.itgl.kd.on{color:#fb923c}
.rangerow{display:flex;gap:4px;padding:4px 8px;flex-shrink:0;border-top:1px solid var(--border);align-items:center}
.rbtn{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px;border:1px solid var(--border);background:none;color:var(--t2);cursor:pointer;transition:all .15s}
.rbtn:hover{color:var(--t0);border-color:var(--border2)}
.rbtn.sel{background:var(--bg4);color:var(--acc);border-color:var(--acc)}

/* KD sub-chart */
.kd-area{height:70px;padding:2px 6px;border-top:1px solid var(--border);flex-shrink:0}
.kd-label{font-family:var(--mono);font-size:8px;color:var(--t2);padding:2px 0}

/* ── chip ── */
.chip-sec{padding:8px 10px;border-bottom:1px solid var(--border)}
.chip-ttl{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t2);margin-bottom:7px}
.chip-row{display:flex;align-items:center;margin-bottom:5px;gap:6px}
.chip-nm{font-size:11px;color:var(--t1);width:52px;flex-shrink:0}
.chip-bw{flex:1;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.chip-b{height:5px;border-radius:3px;transition:width .5s ease}
.chip-v{font-family:var(--mono);font-size:10px;width:64px;text-align:right;flex-shrink:0}

/* ── alerts ── */
.alist{padding:6px 10px}
.aitem{display:flex;align-items:center;justify-content:space-between;padding:7px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;margin-bottom:5px;gap:5px}
.aitem.trig{border-color:var(--gold);background:rgba(245,166,35,.06);animation:glow 2s ease-in-out 3}
@keyframes glow{0%,100%{box-shadow:none}50%{box-shadow:0 0 10px rgba(245,166,35,.4)}}
.a-info{flex:1;min-width:0}
.a-stk{font-family:var(--mono);font-size:11px;color:var(--t0);font-weight:700}
.a-cond{font-size:10px;color:var(--t1);margin-top:1px}
.a-st{font-family:var(--mono);font-size:9px}
.adbtn{background:none;border:none;color:var(--t3);cursor:pointer;font-size:12px;padding:2px;transition:color .15s}
.adbtn:hover{color:var(--dn)}
.aform{padding:8px 10px;border-top:1px solid var(--border);flex-shrink:0}
.aform-lbl{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);margin-bottom:5px}
.arow{display:flex;gap:4px;margin-bottom:5px}
.asel,.ainput{background:var(--bg1);border:1px solid var(--border2);color:var(--t0);font-family:var(--mono);font-size:11px;padding:5px 7px;border-radius:3px;outline:none;min-width:0}
.asel:focus,.ainput:focus{border-color:var(--acc)}
.asel{flex:1.2}.ainput{flex:1}

/* ── mobile nav ── */
.mobile-nav{display:none;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:var(--safe-bottom)}
@media(max-width:819px){.mobile-nav{display:flex}}
.mnav-btn{flex:1;padding:10px 4px;text-align:center;background:none;border:none;color:var(--t2);cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;transition:color .15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.mnav-btn .icon{font-size:18px;line-height:1}
.mnav-btn.active{color:var(--acc)}
.mnav-btn:active{color:var(--t0)}

/* ── mobile panel visibility ── */
@media(max-width:819px){
  .panel{display:none}
  .panel.mob-active{display:flex}
  .sumstrip{grid-template-columns:repeat(3,1fr)}
}

/* ── modal ── */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:flex-end;justify-content:center}
@media(min-width:500px){.mbg{align-items:center}}
.mbg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:10px 10px 0 0;padding:20px;width:100%;max-width:380px}
@media(min-width:500px){.modal{border-radius:10px}}
.mtitle{font-family:var(--mono);font-size:13px;color:var(--t0);margin-bottom:12px}
.mdesc{font-size:11px;color:var(--t1);margin-bottom:12px;line-height:1.6}
.mrow{display:flex;gap:6px}
.minput{flex:1;background:var(--bg1);border:1px solid var(--border2);color:var(--t0);font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:4px;outline:none}
.minput:focus{border-color:var(--acc)}
.mbtn{background:var(--up2);border:none;color:#fff;font-family:var(--mono);font-size:11px;padding:8px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}
.mbtn:hover{background:var(--up)}
.mbtn.sec{background:var(--bg4);border:1px solid var(--border2);color:var(--t1)}
.frow{margin-bottom:10px}
.flbl{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);margin-bottom:3px;display:block}
.finput{width:100%;background:var(--bg1);border:1px solid var(--border2);color:var(--t0);font-family:var(--mono);font-size:12px;padding:7px 10px;border-radius:4px;outline:none}
.finput:focus{border-color:var(--acc)}
.mbtns{display:flex;gap:6px;margin-top:12px}
.mok{flex:1;background:var(--up2);border:none;color:#fff;font-family:var(--mono);font-size:11px;padding:8px;border-radius:4px;cursor:pointer}
.mcancel{flex:1;background:var(--bg4);border:1px solid var(--border2);color:var(--t1);font-family:var(--mono);font-size:11px;padding:8px;border-radius:4px;cursor:pointer}

/* ── toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--gold);border-radius:6px;padding:10px 16px;font-family:var(--mono);font-size:11px;color:var(--gold);z-index:300;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:toastIn .3s ease-out;white-space:nowrap;max-width:90vw;text-overflow:ellipsis;overflow:hidden}
@keyframes toastIn{from{transform:translateX(-50%) translateY(10px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:var(--t2);font-family:var(--mono);font-size:11px;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:24px 12px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--t3);line-height:1.8}

/* ── export panel ── */
.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.exp-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s}
.exp-btn:hover,.exp-btn:active{background:var(--bg4);border-color:var(--border3)}
.exp-icon{font-size:22px;margin-bottom:5px}
.exp-label{font-family:var(--mono);font-size:10px;color:var(--t1)}
.exp-desc{font-size:10px;color:var(--t3);margin-top:2px}

/* ── stock autocomplete ── */
.autocomplete-wrap{position:relative}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--bg1);border:1px solid var(--border2);border-radius:0 0 6px 6px;z-index:500;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ac-item{padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .1s;border-bottom:1px solid var(--border)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.focused{background:var(--bg3)}
.ac-id{font-family:var(--mono);font-size:12px;color:var(--acc);width:46px;flex-shrink:0;font-weight:700}
.ac-name{font-size:13px;color:var(--t0)}
.ac-type{font-size:10px;color:var(--t2);margin-left:auto;flex-shrink:0}
.ac-empty{padding:10px 12px;font-size:12px;color:var(--t2);font-family:var(--mono)}
.ac-loading{padding:10px 12px;font-size:12px;color:var(--t2);font-family:var(--mono);display:flex;align-items:center;gap:6px}

/* install banner */
.install-banner{display:none;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--acc3);border-bottom:1px solid var(--acc);font-size:12px;color:var(--acc);gap:8px;flex-shrink:0}
.install-banner.show{display:flex}
.install-banner button{background:var(--acc2);border:none;color:#fff;font-family:var(--mono);font-size:10px;padding:4px 10px;border-radius:3px;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <!-- Rendered by JS -->
  <div class="loading" style="height:100vh;height:100dvh">
    <div class="spin"></div>
    <span>載入台股PRO...</span>
  </div>
</div>

<script>
// ── version ─────────────────────────────────────────────────────────────────
const APP_VERSION = 'v10';
console.log('台股PRO', APP_VERSION, '已載入 ✓');console.log('台股PRO', APP_VERSION, '已載入 ✓');

// ── 股票代號搜尋（TWSE 上市 + 上櫃） ─────────────────────────────────────────
let _stockList = null; // 快取所有上市股票
let _otcList   = null; // 快取所有上櫃股票

async function fetchStockList(){
  if(_stockList) return _stockList;
  try{
    // TWSE 上市股票清單
    const r = await fetch('https://www.twse.com.tw/rwd/zh/api/codeQuery?query=&response=json&_='+Date.now());
    const j = await r.json();
    // Response: { suggestions: ["2330	臺積電	上市", ...] }
    if(j.suggestions){
      _stockList = j.suggestions
        .filter(s=>s && s!=='符合條件的資料筆數不足，請重新輸入！')
        .map(s=>{
          const parts = s.split('	');
          return {id:parts[0]?.trim(), name:parts[1]?.trim(), type:parts[2]?.trim()||'上市'};
        }).filter(s=>s.id && s.name && /^[0-9]{4,6}$/.test(s.id));
    }
  }catch{}
  if(!_stockList) _stockList = [];
  return _stockList;
}

// ── 上櫃股票本地清單（常見股票，避免 CORS 問題） ─────────────────────────────
// 格式：[代號, 名稱]
const OTC_STOCKS = [
  ['1258','其祥-KY'],['1268','漢來美食'],['1569','濱川'],['1580','新麥'],
  ['2014','中鴻'],['2049','上銀'],['2059','川湖'],['2104','中橡'],
  ['2207','和泰車'],['2231','為升'],['2239','飛三'],['2247','芯鼎'],
  ['2250','小米集團'],['2260','特昇-KY'],['2305','全友'],['2308','台達電'],
  ['2345','智邦'],['2350','環電'],['2351','順德'],['2352','佳世達'],
  ['2353','宏碁'],['2356','英業達'],['2360','致茂'],['2362','藍天'],
  ['2364','倫飛'],['2365','昆盈'],['2367','燿華'],['2375','凱美'],
  ['2376','技嘉'],['2379','瑞昱'],['2383','台光電'],['2385','群光'],
  ['2387','精元'],['2392','正崴'],['2393','億光'],['2397','友通'],
  ['2399','映泰'],['2401','凌陽'],['2402','毅嘉'],['2406','國碩'],
  ['2408','南亞科'],['2414','精技'],['2415','錩泰'],['2419','仲琦'],
  ['2423','固緯'],['2424','隴華'],['2425','承啟'],['2426','鼎元'],

async function searchStocks(query){
  query = query.trim();
  if(!query || query.length < 1) return [];

  const results = [];
  const seen = new Set();

  // ── 1. 先查 TWSE 上市（有 codeQuery API） ──
  try{
    const r = await fetch(
      'https://www.twse.com.tw/rwd/zh/api/codeQuery?query='+encodeURIComponent(query)+'&response=json&_='+Date.now()
    );
    const j = await r.json();
    if(j.suggestions){
      j.suggestions
        .filter(s => s && s !== '符合條件的資料筆數不足，請重新輸入！')
        .slice(0, 8)
        .forEach(s => {
          const parts = s.split('\t');
          const id = parts[0]?.trim(), name = parts[1]?.trim();
          if(id && name && !seen.has(id)){
            seen.add(id);
            results.push({id, name, type: parts[2]?.trim() || '上市'});
          }
        });
    }
  }catch(e){ console.warn('TWSE search error:', e); }

  // ── 2. 本地比對上櫃股票清單 ──
  const q = query.toLowerCase();
  OTC_STOCKS.forEach(([id, name]) => {
    if(seen.has(id)) return;
    if(id.startsWith(query) || name.includes(query)){
      seen.add(id);
      results.push({id, name, type:'上櫃'});
    }
  });

  return results.slice(0, 10);
}

// Autocomplete state (outside React-like state to avoid full re-render)
let _acResults = [];
let _acLoading = false;
let _acTimer   = null;
let _acFocus   = -1;

function onStockInput(e){
  const val = e.target.value.trim();
  clearTimeout(_acTimer);
  _acFocus = -1;
  if(!val){ setAcResults([]); return; }
  _acLoading = true;
  updateAcDropdown();
  _acTimer = setTimeout(async()=>{
    const results = await searchStocks(val);
    _acLoading = false;
    setAcResults(results);
    // Auto-fill if exact match
    if(results.length===1 && results[0].id===val){
      fillStock(results[0]);
      setAcResults([]);
    }
  }, 300);
}

function onStockKeydown(e){
  const list = document.getElementById('ac-list');
  if(!list) return;
  const items = list.querySelectorAll('.ac-item');
  if(e.key==='ArrowDown'){ e.preventDefault(); _acFocus=Math.min(_acFocus+1,items.length-1); highlightAc(items); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); _acFocus=Math.max(_acFocus-1,0); highlightAc(items); }
  else if(e.key==='Enter' && _acFocus>=0){ e.preventDefault(); items[_acFocus]?.click(); }
  else if(e.key==='Escape'){ setAcResults([]); }
}

function highlightAc(items){
  items.forEach((el,i)=>el.classList.toggle('focused',i===_acFocus));
  items[_acFocus]?.scrollIntoView({block:'nearest'});
}

function setAcResults(results){
  _acResults = results;
  updateAcDropdown();
}

function updateAcDropdown(){
  const list = document.getElementById('ac-list');
  if(!list) return;
  if(_acLoading){
    list.innerHTML = '<div class="ac-loading"><span class="spin" style="width:12px;height:12px;border-width:1.5px"></span>搜尋中...</div>';
    list.style.display='block'; return;
  }
  if(!_acResults.length){ list.style.display='none'; return; }
  list.style.display='block';
  list.innerHTML = _acResults.map((s,i)=>
    `<div class="ac-item" onclick="fillStock({id:'${s.id}',name:'${s.name.replace(/'/g,"\\'")}',type:'${s.type}'})">
      <span class="ac-id">${s.id}</span>
      <span class="ac-name">${s.name}</span>
      <span class="ac-type">${s.type}</span>
    </div>`
  ).join('');
}

function fillStock(stock){
  const idEl   = document.getElementById('add-id');
  const nameEl = document.getElementById('add-name');
  if(idEl)   idEl.value   = stock.id;
  if(nameEl) nameEl.value = stock.name;
  setAcResults([]);
  // Focus shares field next
  document.getElementById('add-shares')?.focus();
}

// ── localStorage helpers ──────────────────────────────────────────────────────
const LS_KEY = 'twse-pro-holdings-v2';
const LS_ALERTS = 'twse-pro-alerts-v1';

function makeHolding(id, name, shares, cost){
  return {id, name:name||id, shares:+shares, cost:+cost,
    price:null, change:null, changePct:null, history:null,
    chip:null, source:null, flash:'', updatedAt:null};
}

function saveHoldings(holdings){
  try{
    const slim = holdings.map(h=>({id:h.id,name:h.name,shares:h.shares,cost:h.cost}));
    localStorage.setItem(LS_KEY, JSON.stringify(slim));
  }catch{}
}

function loadHoldings(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length) return arr.map(h=>makeHolding(h.id,h.name,h.shares,h.cost));
    }
  }catch{}
  return null;
}

function saveAlerts(alerts){
  try{ localStorage.setItem(LS_ALERTS, JSON.stringify(alerts)); }catch{}
}

function loadAlerts(){
  try{
    const raw = localStorage.getItem(LS_ALERTS);
    if(raw){ const arr=JSON.parse(raw); if(Array.isArray(arr)) return arr; }
  }catch{}
  return [];
}

// ── TWSE API ──────────────────────────────────────────────────────────────────
async function fetchTWSEStock(stockId){
  const now = new Date();
  let allData = [];
  // 判斷是否為上櫃股票（4位數開頭為3,4,5,6,7,8 或 5位數）
  const isOTC = /^[3-9]/.test(stockId) && stockId.length === 4 || stockId.length >= 5;

  for(let i=0;i<2;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ds = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}01`;
    try{
      let r, j;
      if(isOTC){
        // 上櫃股票使用 TPEx API
        const rocYear = d.getFullYear()-1911;
        const month   = String(d.getMonth()+1).padStart(2,'0');
        r = await fetch(`https://www.tpex.org.tw/web/stock/aftertrading/daily_trading_info/st43_result.php?l=zh-tw&d=${rocYear}/${month}&stkno=${stockId}&_=${Date.now()}`);
        j = await r.json();
        // TPEx format: {aaData: [["114/01/02","..","..","..","..","..","收盤","漲跌",..], ...]}
        if(j.aaData && j.aaData.length){
          const parsed = j.aaData.map(row => {
            const parseN = s => parseFloat((s||'0').replace(/,/g,''));
            return {
              date: row[0], open: parseN(row[3]), high: parseN(row[4]),
              low:  parseN(row[5]), close: parseN(row[6]),
              vol:  parseInt((row[1]||'0').replace(/,/g,'')),
              change: parseN(row[7])
            };
          }).filter(r => !isNaN(r.close));
          allData = [...parsed, ...allData];
        }
      } else {
        // 上市股票使用 TWSE API
        r = await fetch(`https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date=${ds}&stockNo=${stockId}&response=json&_=${Date.now()}`);
        j = await r.json();
        if(j.stat==='OK'&&j.data) allData = [...j.data, ...allData];
      }
    }catch{}
  }
  if(!allData.length) return null;
  let rows;
  if(isOTC){
    // OTC data already parsed as objects inside the loop
    rows = allData.filter(r=>!isNaN(r.close));
  } else {
    const p = s => parseFloat((s||'').replace(/,/g,''));
    rows = allData.map(r=>({
      date:r[0], open:p(r[3]), high:p(r[4]), low:p(r[5]), close:p(r[6]),
      vol:parseInt((r[1]||'').replace(/,/g,'')),
      change: p((r[7]||'').replace('▲','').replace('▼', (r[7]||'').includes('▼')?'-':'')),
    })).filter(r=>!isNaN(r.close));
  }
  if(!rows.length) return null;
  const last = rows[rows.length-1], prev = rows.length>1?rows[rows.length-2]:null;
  return { price:last.close, change:last.change, changePct:prev?((last.close-prev.close)/prev.close*100):0, history:rows, source:'eod' };
}

async function fetchTWSEInstitutional(stockId){
  const now = new Date();
  const ds = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}01`;
  try{
    const r = await fetch(`https://www.twse.com.tw/rwd/zh/fund/T86?date=${ds}&selectType=ALLBUT0999&response=json&_=${Date.now()}`);
    const j = await r.json();
    if(j.stat!=='OK'||!j.data) return null;
    const row = j.data.find(d=>d[0]===stockId);
    if(!row) return null;
    const pi = s => parseInt((s||'0').replace(/,/g,'').replace(/\+/g,''));
    return { foreign:pi(row[4]), trust:pi(row[10]), dealer:pi(row[13]), total:pi(row[4])+pi(row[10])+pi(row[13]) };
  }catch{ return null; }
}

async function fetchFugleQuote(stockId, token){
  const r = await fetch(`https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/${stockId}`,{headers:{'X-API-KEY':token}});

  return { price:j.closePrice??j.lastPrice??j.referencePrice, change:j.change??0, changePct:j.changePercent??0, open:j.openPrice, high:j.highPrice, low:j.lowPrice, volume:j.volume, name:j.name, source:'fugle-rt' };

// ── Technical Indicators ──────────────────────────────────────────────────────
function calcMA(data, n){
  return data.map((_,i) => i<n-1 ? null : data.slice(i-n+1,i+1).reduce((s,d)=>s+d.close,0)/n);
}

function calcBollinger(data, n=20, k=2){
  const mas = calcMA(data, n);
  return data.map((_,i) => {
    if(i<n-1) return null;
    const slice = data.slice(i-n+1,i+1).map(d=>d.close);
    const mean = mas[i];
    const std = Math.sqrt(slice.reduce((s,v)=>s+(v-mean)**2,0)/n);
    return { mid:mean, upper:mean+k*std, lower:mean-k*std };
  });
}

function calcKD(data, n=9){
  // Stochastic KD
  const rsv = data.map((d,i) => {
    if(i<n-1) return 50;
    const slice = data.slice(i-n+1,i+1);
    const hn = Math.max(...slice.map(s=>s.high));
    const ln = Math.min(...slice.map(s=>s.low));
    return hn===ln ? 50 : (d.close-ln)/(hn-ln)*100;
  });
  const K = [], D = [];
  rsv.forEach((r,i) => {
    const prevK = i===0 ? 50 : K[i-1];
    const prevD = i===0 ? 50 : D[i-1];
    K.push(prevK*2/3 + r/3);
    D.push(prevD*2/3 + K[K.length-1]/3);
  });
  return data.map((_,i) => ({k:K[i], d:D[i], date:data[i].date}));
}

// ── Fugle K線資料 API ─────────────────────────────────────────────────────────
// interval: 1 | 5 | 10 | 15 | 30 | 60 (分鐘) | D (日)
async function fetchFugleCandles(stockId, token, interval='60', from='', to=''){
  const now = new Date();
  const toDate  = to   || now.toISOString().slice(0,10);
  // Default from: 1 day ago for minutes, 90 days for daily
  const msBack  = ['1','5','10','15','30','60'].includes(interval) ? 2*24*3600000 : 90*24*3600000;
  const fromDate= from || new Date(now-msBack).toISOString().slice(0,10);
  const url = `https://api.fugle.tw/marketdata/v1.0/stock/historical/candles/${stockId}?resolution=${interval}&from=${fromDate}&to=${toDate}&sort=asc`;
  const r = await fetch(url, {headers:{'X-API-KEY':token}});
  if(!r.ok) throw new Error('Fugle candles HTTP '+r.status);
  const j = await r.json();
  if(!j.candles||!j.candles.length) return null;
  return j.candles.map(c=>({
    date: c.date||c.datetime||'',
    open:  c.open,  high: c.high,
    low:   c.low,   close:c.close,
    vol:   c.volume||0
  }));
}

// ── Fugle WS ──────────────────────────────────────────────────────────────────
function connectWS(key){
  if(wsRef){wsRef.close();}
  setState({wsStatus:'connecting'});
  const ids = state.holdings.map(h=>h.id);
  wsRef = new WebSocket(`wss://api.fugle.tw/marketdata/v1.0/stock/streaming?apikey=${key}`);
  wsRef.onopen = () => {
    setState({wsStatus:'live'});
    ids.forEach(id=>{
      wsRef.send(JSON.stringify({action:'subscribe',params:{channel:'quotes',symbol:id}}));
    });
    showToast('⚡ 富果 WebSocket 已連線');
  };
  wsRef.onmessage = e => {
    try{
      const msg = JSON.parse(e.data);
      if(msg.event==='data'&&msg.data){
        const d = msg.data;
        const price = d.closePrice??d.price;
        if(!d.symbol||!price) return;
        const holdings = state.holdings.map(h => {
          if(h.id!==d.symbol) return h;
          const up = price>=(h.price??price);
          if(flashTimers[h.id]) clearTimeout(flashTimers[h.id]);
          flashTimers[h.id] = setTimeout(()=>{
            const hs = state.holdings.map(x=>x.id===h.id?{...x,flash:''}:x);
            setState({holdings:hs});
          }, 800);
          return{...h, price, change:d.change??0, changePct:d.changePercent??0, source:'fugle-ws', flash:up?'fg':'fr', updatedAt:new Date().toLocaleTimeString('zh-TW')};
        });
        setState({holdings, lastUpdate:'WS '+new Date().toLocaleTimeString('zh-TW')});
        // check alerts
        checkAlerts(holdings);
      }
    }catch{}
  };
  wsRef.onerror = () => { setState({wsStatus:'error'}); showToast('❌ WebSocket 連線失敗'); };
  wsRef.onclose = () => setState({wsStatus:'offline'});
}

function disconnectWS(){
  if(wsRef){wsRef.close();wsRef=null;}
  setState({wsStatus:'offline'});
}

// ── Alerts ────────────────────────────────────────────────────────────────────
function checkAlerts(holdings){
  let triggered = false;
  const alerts = state.alerts.map(a => {
    if(a.triggered) return a;
    const h = holdings.find(x=>x.id===a.stockId);
    if(!h||h.price==null) return a;
    const hit = (a.type==='above'&&h.price>=a.targetPrice)||(a.type==='below'&&h.price<=a.targetPrice);
    if(hit){
      triggered = true;
      showToast(`🔔 ${h.name} 已${a.type==='above'?'突破':'跌破'} ${a.targetPrice} 元！`);
      // Try browser notification
      if(Notification.permission==='granted'){
        new Notification(`台股PRO 到價警報`, {body:`${h.name} 已${a.type==='above'?'突破':'跌破'} ${a.targetPrice} 元！`,icon:'icon-192.svg'});
      }
      return {...a, triggered:true};
    }
    return a;
  });
  if(triggered) setState({alerts});
}

// ── K-line Canvas ─────────────────────────────────────────────────────────────
function drawKLine(canvas, history, range, indicators){
  if(!canvas||!history||!history.length) return;
  const data = range===7?history.slice(-7):range===14?history.slice(-14):range===30?history.slice(-30):history.slice(-60);
  if(!data.length) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if(!W||!H) return;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  const padL=38, padR=8, padT=8, padB=22;
  const cW=W-padL-padR, cH=H-padT-padB;
  const prices = data.flatMap(d=>[d.high,d.low]);
  if(indicators.bb){
    const bbs = calcBollinger(data);
    bbs.forEach(b=>{if(b){prices.push(b.upper,b.lower);}});
  }
  const mn=Math.min(...prices), mx=Math.max(...prices), rng=mx-mn||1;
  const yS = v => padT+cH*(1-(v-mn)/rng);
  const xS = i => padL+i*(cW/(data.length-1||1));
  const barW = Math.max(2, cW/data.length*0.55);

  // Grid
  ctx.lineWidth=.5;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=padT+cH*t;
    ctx.strokeStyle='#1a1f28'; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle='#556070'; ctx.font=`9px Space Mono`; ctx.textAlign='right';
    ctx.fillText((mx-(mx-mn)*t).toFixed(0), padL-4, y+3);
  });

  // Bollinger
  if(indicators.bb){
    const bbs = calcBollinger(data);
    ['upper','lower','mid'].forEach((key,ki) => {
      ctx.strokeStyle = key==='mid'?'rgba(61,158,255,.4)':'rgba(56,189,248,.5)';
      ctx.lineWidth = key==='mid'?.8:1; ctx.setLineDash(key==='mid'?[3,3]:[]);
      ctx.beginPath();
      bbs.forEach((b,i) => { if(!b)return; key==='upper'?ctx.lineTo(xS(i),yS(b.upper)):key==='lower'?ctx.lineTo(xS(i),yS(b.lower)):ctx.lineTo(xS(i),yS(b.mid)); });
      ctx.stroke(); ctx.setLineDash([]);
    });
    // Fill between bands
    const bbs2 = calcBollinger(data);
    ctx.fillStyle='rgba(56,189,248,.04)';
    ctx.beginPath();
    bbs2.forEach((b,i)=>{if(b)ctx.lineTo(xS(i),yS(b.upper));});
    bbs2.slice().reverse().forEach((b,i)=>{if(b)ctx.lineTo(xS(data.length-1-bbs2.slice().reverse().indexOf(b)),yS(b.lower));});
    ctx.fill();
  }

  // MA lines
  if(indicators.ma5){ const ma=calcMA(data,5); drawMALine(ctx,ma,data,xS,yS,'rgba(245,166,35,.75)',1); }
  if(indicators.ma10){ const ma=calcMA(data,10); drawMALine(ctx,ma,data,xS,yS,'rgba(155,109,255,.75)',1); }

  // Candles
  data.forEach((d,i) => {
    const x=xS(i), up=d.close>=d.open, c=up?'#00c896':'#ff4d6a';
    const openY=yS(d.open), closeY=yS(d.close), highY=yS(d.high), lowY=yS(d.low);
    ctx.fillStyle=c; ctx.strokeStyle=c; ctx.lineWidth=.7;
    ctx.beginPath(); ctx.moveTo(x,highY); ctx.lineTo(x,lowY); ctx.stroke();
    const by=Math.min(openY,closeY), bh=Math.max(1,Math.abs(closeY-openY));
    ctx.fillRect(x-barW/2,by,barW,bh);
    if(bh>2) ctx.strokeRect(x-barW/2,by,barW,bh);
  });

  // Volume
  const maxVol=Math.max(...data.map(d=>d.vol||0));
  if(maxVol>0) data.forEach((d,i)=>{
    const x=xS(i), up=d.close>=d.open, vh=((d.vol||0)/maxVol)*(padB-8);
    ctx.fillStyle=up?'rgba(0,200,150,.2)':'rgba(255,77,106,.2)';
    ctx.fillRect(x-barW/2,H-8-vh,barW,vh);
  });

  // X labels
  ctx.fillStyle='#556070'; ctx.font='7.5px Space Mono'; ctx.textAlign='center';
  const step=Math.max(1,Math.floor(data.length/5));
  data.forEach((d,i)=>{ if(i%step===0||i===data.length-1) ctx.fillText(d.date.slice(-5),xS(i),H-padB+13); });
}

function drawMALine(ctx,ma,data,xS,yS,color,lw=1){
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.setLineDash([2,2]);
  ctx.beginPath(); let started=false;
  ma.forEach((v,i)=>{ if(v==null)return; started?ctx.lineTo(xS(i),yS(v)):ctx.moveTo(xS(i),yS(v)); started=true; });
  ctx.stroke(); ctx.setLineDash([]);
}

function drawKDChart(canvas, history, range){
  if(!canvas||!history||!history.length) return;
  const data = range===7?history.slice(-7):range===14?history.slice(-14):range===30?history.slice(-30):history.slice(-60);
  const kd = calcKD(data);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const W=canvas.offsetWidth, H=canvas.offsetHeight;
  if(!W||!H) return;
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const padL=30, padR=8, padT=4, padB=4;
  const cW=W-padL-padR, cH=H-padT-padB;
  const xS=i=>padL+i*(cW/(data.length-1||1));
  const yS=v=>padT+cH*(1-v/100);
  // 80/20 lines
  ctx.strokeStyle='#252c38'; ctx.lineWidth=.5;
  [20,50,80].forEach(v=>{ ctx.beginPath(); ctx.moveTo(padL,yS(v)); ctx.lineTo(W-padR,yS(v)); ctx.stroke(); });
  ctx.fillStyle='#303c48'; ctx.font='8px Space Mono'; ctx.textAlign='right';
  [20,80].forEach(v=>ctx.fillText(v,padL-3,yS(v)+3));
  // K line
  ctx.strokeStyle='rgba(251,146,60,.8)'; ctx.lineWidth=1.2;
  ctx.beginPath(); kd.forEach((p,i)=>{ i===0?ctx.moveTo(xS(i),yS(p.k)):ctx.lineTo(xS(i),yS(p.k)); }); ctx.stroke();
  // D line
  ctx.strokeStyle='rgba(61,158,255,.8)'; ctx.lineWidth=1.2;
  ctx.beginPath(); kd.forEach((p,i)=>{ i===0?ctx.moveTo(xS(i),yS(p.d)):ctx.lineTo(xS(i),yS(p.d)); }); ctx.stroke();
  // Legend
  ctx.font='8px Space Mono'; ctx.textAlign='left';
  const lastKD = kd[kd.length-1];
  ctx.fillStyle='rgba(251,146,60,.8)'; ctx.fillText(`K:${lastKD.k.toFixed(1)}`,padL,12);
  ctx.fillStyle='rgba(61,158,255,.8)';  ctx.fillText(`D:${lastKD.d.toFixed(1)}`,padL+50,12);
}

// ── Sparkline ─────────────────────────────────────────────────────────────────
function sparkSVG(data, up, w=44, h=18){
  if(!data||data.length<2) return '';
  const mn=Math.min(...data), mx=Math.max(...data), rng=mx-mn||1, p=2;
  const pts=data.map((v,i)=>`${p+i*(w-2*p)/(data.length-1)},${p+(h-2*p)*(1-(v-mn)/rng)}`).join(' ');
  const c=up?'#00c896':'#ff4d6a';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:inline-block;vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
}

            <button class="pbtn" onclick="state.modals.batch=true;render()">批次</button>
            <button class="pbtn" onclick="state.modals.csv=true;render()">CSV</button>

  // ── Draw canvas after render ──

    if(s.tab==='kline'){
      const kData = getKLineData();

      if(canvas && kData && kData.length){

// ── event handlers ────────────────────────────────────────────────────────────
// ── edit holding ─────────────────────────────────────────────────────────────
function openEdit(id){
  const h = state.holdings.find(x=>x.id===id);
  if(!h) return;
  setState({modals:{...state.modals,edit:true}, editTarget:{id:h.id,name:h.name,shares:h.shares,cost:h.cost}});
}

function saveEdit(){
  const id = state.editTarget?.id;
  if(!id) return;
  const name   = document.getElementById('edit-name')?.value?.trim();
  const shares = parseFloat(document.getElementById('edit-shares')?.value);
  const cost   = parseFloat(document.getElementById('edit-cost')?.value);
  if(!name||!shares||isNaN(cost)){ showToast('❌ 請填寫完整資料'); return; }
  const holdings = state.holdings.map(h =>
    h.id===id ? {...h, name, shares, cost} : h
  );
  setState({holdings, modals:{...state.modals,edit:false}, editTarget:null});
  showToast('✓ '+name+' 已更新');
}

function removeHolding(id){
  const holdings = state.holdings.filter(h=>h.id!==id);
  setState({holdings, selected: holdings[0]?.id||''});
}

function setKRange(r){ setState({kRange:r, kInterval:'preset', kMode:'day'}); }

function setKRangePreset(r){ setState({kRange:r, kInterval:'preset', kMode:'day'}); }
function openKeyModal(){ setState({modals:{...state.modals,key:true}}); }
function loadFugleCandlesCurrent(){
  const s = state;
  const intervalKey = s.kMode==='60min'?'60':s.kMode==='5min'?'5':'1';
  loadFugleCandles(s.selected, intervalKey);
}

function setKMode(mode){
  setState({kMode:mode, kInterval:'preset'});
  // If switching to minute mode and we have apiKey, fetch candles
  if(mode!=='day' && state.apiKey && state.selected){
    loadFugleCandles(state.selected, mode);
  }
}

function setKIntervalCustom(){ setKInterval('custom'); }
function setKInterval(type){
  setState({kInterval:type});
}

async function loadFugleCandles(stockId, interval){
  if(!state.apiKey){ showToast('⚠️ 請先設定富果 API Key'); return; }
  const cacheKey = stockId+'_'+interval;
  setState({loading:true});
  try{
    const from = state.kInterval==='custom' ? state.kCustomFrom : '';
    const to   = state.kInterval==='custom' ? state.kCustomTo   : '';
    const candles = await fetchFugleCandles(stockId, state.apiKey, interval, from, to);
    if(!candles){ showToast('⚠️ 無法取得分鐘K線，請確認 Key 或市場時間'); setState({loading:false}); return; }
    const fugleCandles = {...state.fugleCandles, [cacheKey]: candles};
    setState({fugleCandles, loading:false});
  }catch(e){
    showToast('❌ 富果K線載入失敗：'+e.message);
    setState({loading:false});
  }
}

function applyCustomRange(){
  const from = document.getElementById('kc-from')?.value;
  const to   = document.getElementById('kc-to')?.value;
  if(!from||!to){ showToast('❌ 請選擇起訖日期'); return; }
  if(from>to){ showToast('❌ 起始日期不能晚於結束日期'); return; }
  setState({kCustomFrom:from, kCustomTo:to, kInterval:'custom'});
  const mode = state.kMode;
  if(mode==='day'){
    // reload TWSE with custom range (filter from history)
    showToast('✓ 套用自訂區間');
  } else {
    loadFugleCandles(state.selected, mode==='60min'?'60':mode==='5min'?'5':'1');
  }
}

function getKLineData(){
  const s = state;
  const selH = s.holdings.find(h=>h.id===s.selected);
  if(!selH) return null;

  if(s.kMode==='day'){
    if(!selH.history||!selH.history.length) return null;
    let data = selH.history;
    if(s.kInterval==='custom' && s.kCustomFrom && s.kCustomTo){
      data = data.filter(d=>{
        // TWSE date format: 113/01/15 (ROC year) — convert to compare
        const parts = d.date.split('/');
        if(parts.length===3){
          const year = parseInt(parts[0])+1911;
          const iso  = `${year}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
          return iso>=s.kCustomFrom && iso<=s.kCustomTo;
        }
        return true;
      });
    } else {
      const n = s.kRange===7?7:s.kRange===14?14:s.kRange===30?30:60;
      data = data.slice(-n);
    }
    return data;
  }

  // Minute modes — from Fugle
  const intervalMap = {'60min':'60','5min':'5','1min':'1'};
  const interval = intervalMap[s.kMode]||'60';
  const cacheKey = (selH.id)+'_'+interval;
  return s.fugleCandles[cacheKey] || null;
}

function toggleIndicator(key){
  setState({indicators:{...state.indicators,[key]:!state.indicators[key]}});
}

function setMobileTab(tab){ setState({mobileTab:tab}); }

function setApiKey(){
  const input = document.getElementById('key-input');
  if(!input||!input.value.trim()) return;
  setState({apiKey:input.value.trim(), modals:{...state.modals,key:false}});
  showToast('✓ API Key 已設定');
}

function addHolding(){
  const id   = document.getElementById('add-id')?.value?.trim();
  const name = document.getElementById('add-name')?.value?.trim();
  const shares = parseFloat(document.getElementById('add-shares')?.value);
  const cost   = parseFloat(document.getElementById('add-cost')?.value);
  if(!id||!shares||!cost){ showToast('❌ 請填寫代號、股數、成本'); return; }
  if(state.holdings.find(h=>h.id===id)){ showToast('⚠️ '+id+' 已在清單中'); return; }
  const newH = makeHolding(id, name||id, shares, cost);
  const newHoldings = [...state.holdings, newH];
  setState({holdings:newHoldings, modals:{...state.modals,add:false}});
  showToast('✓ 已新增 '+id+'，正在抓取收盤資料...');
  // Auto-fetch TWSE immediately after adding
  fetchTWSEStock(id).then(d=>{
    if(d){
      const hs = state.holdings.map(h=>h.id===id?{...h,...d}:h);
      setState({holdings:hs});
      showToast('✓ '+id+(d.price?' $'+d.price:'')+' 收盤資料已載入');
    } else {
      showToast('⚠️ '+id+' 找不到 TWSE 資料，請確認代號');
    }
  }).catch(()=>showToast('⚠️ 網路錯誤，請按 TWSE 重新載入'));
}

// ── 批次新增 ───────────────────────────────────────────────────────────────────
function addBatch(){
  const raw = document.getElementById('batch-input')?.value?.trim();
  if(!raw){ showToast('❌ 請輸入股票資料'); return; }
  const lines = raw.split(/\n/).map(l=>l.trim()).filter(l=>l);
  const newOnes = [];
  const errors = [];
  lines.forEach(line => {
    // Support formats: "2330" / "2330 台積電" / "2330,台積電,1000,680" / "2330 台積電 1000 680"
    const parts = line.split(/[,\s]+/);
    const id = parts[0]?.trim();
    if(!id || !/^\d{4,6}$/.test(id)){ errors.push(line); return; }
    if(state.holdings.find(h=>h.id===id) || newOnes.find(h=>h.id===id)){ return; }
    const name   = parts[1] && isNaN(parts[1]) ? parts[1] : id;
    const shares = parseFloat(parts[2]) || 1000;
    const cost   = parseFloat(parts[3]) || 0;
    newOnes.push(makeHolding(id, name, shares, cost));
  });
  if(!newOnes.length){ showToast('⚠️ 沒有新的有效代號（已存在或格式錯誤）'); return; }
  const newHoldings = [...state.holdings, ...newOnes];
  setState({holdings:newHoldings, modals:{...state.modals,batch:false}});
  showToast('✓ 已新增 '+newOnes.length+' 檔，正在批次載入收盤資料...');
  if(errors.length) showToast('⚠️ 以下無法識別：'+errors.join(', '));
  // Batch fetch TWSE
  Promise.all(newOnes.map(h =>
    fetchTWSEStock(h.id).then(d=>{
      if(d){ const hs=state.holdings.map(x=>x.id===h.id?{...x,...d}:x); setState({holdings:hs}); }
    }).catch(()=>{})
  )).then(()=> showToast('✓ 批次收盤資料載入完成'));
}

// ── CSV 匯入 ───────────────────────────────────────────────────────────────────
function handleCSVImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const text = ev.target.result;
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    const newOnes = [];
    // Skip header row if first cell isn't a stock id
    const start = /^\d{4,6}/.test(lines[0]?.split(/[,\t]/)[0]) ? 0 : 1;
    for(let i=start;i<lines.length;i++){
      const cols = lines[i].split(/[,\t]/);
      const id = cols[0]?.trim().replace(/"/g,'');
      if(!id||!/^\d{4,6}$/.test(id)) continue;
      if(state.holdings.find(h=>h.id===id)||newOnes.find(h=>h.id===id)) continue;
      const name   = cols[1]?.trim().replace(/"/g,'') || id;
      const shares = parseFloat(cols[2]) || 1000;
      const cost   = parseFloat(cols[3]) || 0;
      newOnes.push(makeHolding(id, name, shares, cost));
    }
    if(!newOnes.length){ showToast('⚠️ CSV 中找不到有效的股票代號'); return; }
    const newHoldings = [...state.holdings, ...newOnes];
    setState({holdings:newHoldings, modals:{...state.modals,csv:false}});
    showToast('✓ CSV 匯入 '+newOnes.length+' 檔，載入收盤資料中...');
    Promise.all(newOnes.map(h=>
      fetchTWSEStock(h.id).then(d=>{
        if(d){ const hs=state.holdings.map(x=>x.id===h.id?{...x,...d}:x); setState({holdings:hs}); }
      }).catch(()=>{})
    )).then(()=>showToast('✓ CSV 收盤資料載入完成'));
  };
  reader.readAsText(file, 'UTF-8');
}

// ── 自動載入邏輯 ──────────────────────────────────────────────────────────────
// 規則：
//   1. 每次進入頁面，自動從 TWSE 抓最新收盤資料
//   2. 若上次載入距現在不超過 30 分鐘（同一個交易日內），跳過（避免重複請求）
//   3. 週六/日盤後不重複載入（TWSE 無新資料）

const LS_LAST_LOAD = 'twse-pro-last-load';

function shouldAutoLoad(){
  try{
    const last = parseInt(localStorage.getItem(LS_LAST_LOAD) || '0');
    const now  = Date.now();
    const diffMin = (now - last) / 60000;
    // 距上次載入超過 30 分鐘才重新抓
    return diffMin > 30;
  }catch{ return true; }
}

function markLoaded(){
  try{ localStorage.setItem(LS_LAST_LOAD, Date.now().toString()); }catch{}
}

async function autoLoad(){
  if(!shouldAutoLoad()){
    showToast('✓ 已有今日資料（' + state.lastUpdate + '）');
    return;
  }
  showToast('🔄 自動載入 TWSE 收盤資料中...');
  await loadTWSE();
  markLoaded();
}

// 頁面載入後自動執行
autoLoad();
